<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Usman — Web Designer</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,500;1,600&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050507;
      color: #f5f5f5;
      font-family: Inter, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =====================================================
       CINEMATIC BACKGROUND
    ===================================================== */

    .cinematic-bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      overflow: hidden;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 20% 20%,
          rgba(93, 74, 255, .18),
          transparent 34%
        ),
        radial-gradient(
          circle at 80% 30%,
          rgba(0, 190, 255, .12),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #040407,
          #080b18 50%,
          #040408
        );
    }


    /* Moving colored sky */

    .sky-glow {
      position: absolute;
      width: 45vw;
      height: 45vw;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .34;
      animation: glowMove 14s ease-in-out infinite alternate;
    }

    .glow-one {
      background: #6555ff;
      top: -18%;
      left: -12%;
    }

    .glow-two {
      background: #00bfff;
      right: -18%;
      top: 20%;
      animation-delay: -6s;
    }

    @keyframes glowMove {

      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      50% {
        transform: translate3d(100px, 60px, 0) scale(1.15);
      }

      100% {
        transform: translate3d(-60px, 120px, 0) scale(.95);
      }
    }


    /* =====================================================
       BLURRY CLOUDS
    ===================================================== */

    .cloud {
      position: absolute;

      width: 420px;
      height: 130px;

      border-radius: 50%;

      background:
        radial-gradient(
          ellipse,
          rgba(255,255,255,.07),
          rgba(255,255,255,.015),
          transparent 70%
        );

      filter: blur(35px);

      opacity: .65;

      animation:
        cloudMove 38s linear infinite;
    }

    .cloud-one {
      top: 13%;
      left: -500px;
    }

    .cloud-two {
      top: 42%;
      left: -650px;
      width: 560px;
      height: 150px;
      animation-duration: 48s;
      animation-delay: -15s;
    }

    .cloud-three {
      top: 70%;
      left: -500px;
      width: 360px;
      animation-duration: 42s;
      animation-delay: -25s;
    }

    @keyframes cloudMove {

      from {
        transform:
          translateX(0)
          scale(1);
      }

      to {
        transform:
          translateX(150vw)
          scale(1.25);
      }
    }


    /* =====================================================
       MOVING WAVES
    ===================================================== */

    .wave {
      position: absolute;

      width: 170%;
      height: 300px;

      left: -35%;
      bottom: -150px;

      border-radius: 50%;

      filter: blur(35px);

      opacity: .2;

      transform-origin: center;

      animation:
        waveMove 13s ease-in-out infinite alternate;
    }

    .wave-one {
      background:
        linear-gradient(
          90deg,
          #6655ff,
          #00bfff,
          #9c4dff
        );
    }

    .wave-two {
      bottom: -195px;

      background:
        linear-gradient(
          90deg,
          #00bfff,
          #6655ff,
          #ff4ecd
        );

      animation-duration: 17s;
      animation-delay: -5s;
    }

    .wave-three {
      bottom: -240px;

      background:
        linear-gradient(
          90deg,
          #ff4ecd,
          #6655ff,
          #00bfff
        );

      animation-duration: 21s;
      animation-delay: -9s;
    }

    @keyframes waveMove {

      0% {
        transform:
          translateX(-4%)
          rotate(-2deg)
          scaleY(.9);
      }

      50% {
        transform:
          translateX(4%)
          rotate(2deg)
          scaleY(1.2);
      }

      100% {
        transform:
          translateX(-2%)
          rotate(-1deg)
          scaleY(1);
      }
    }


    /* =====================================================
       FLOATING PARTICLES
    ===================================================== */

    .stars {
      position: absolute;
      inset: 0;

      opacity: .18;

      background-image:
        radial-gradient(
          circle,
          rgba(255,255,255,.8) 1px,
          transparent 1px
        );

      background-size: 90px 90px;

      animation:
        starsMove 22s linear infinite;
    }

    @keyframes starsMove {

      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-90px);
      }
    }


    /* =====================================================
       FILM GRAIN
    ===================================================== */

    .film-grain {
      position: absolute;
      inset: 0;

      opacity: .025;

      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }


    /* =====================================================
       CURSOR GLOW
    ===================================================== */

    .cursor-glow {
      position: fixed;

      width: 320px;
      height: 320px;

      border-radius: 50%;

      pointer-events: none;

      z-index: 999;

      background:
        radial-gradient(
          circle,
          rgba(70, 170, 255, .13),
          transparent 65%
        );

      transform:
        translate(-50%, -50%);

      mix-blend-mode: screen;

      transition:
        left .08s linear,
        top .08s linear;
        opacity: .8;
    }


    /* =====================================================
       NAVBAR
    ===================================================== */

    nav {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;

      padding: 25px 7%;

      display: flex;

      justify-content: space-between;
      align-items: center;

      z-index: 100;

      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.75),
          transparent
        );

      transition: .4s ease;
    }

    nav.scrolled {
      padding-top: 16px;
      padding-bottom: 16px;

      background:
        rgba(5,5,10,.72);

      backdrop-filter: blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,.06);
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -1px;

      transition: .4s;
    }

    .logo:hover {
      letter-spacing: 3px;
    }

    nav .links {
      display: flex;
      gap: 30px;

      font-size: 13px;

      color: #aaa;
    }

    nav .links a {
      position: relative;

      transition: .3s;
    }

    nav .links a::after {
      content: "";

      position: absolute;

      width: 0;
      height: 1px;

      bottom: -6px;
      left: 0;

      background:
        linear-gradient(
          90deg,
          #6b5cff,
          #00c8ff
        );

      transition: .3s;
    }

    nav .links a:hover {
      color: white;
    }

    nav .links a:hover::after {
      width: 100%;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {
      min-height: 100vh;

      display: flex;

      align-items: center;
      justify-content: center;

      text-align: center;

      padding:
        100px 20px 60px;

      position: relative;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(35,35,65,.45),
          transparent 48%
        );
    }

    .hero-content {
      max-width: 850px;

      animation:
        heroIn 1.2s
        cubic-bezier(.16,1,.3,1)
        forwards;
    }

    .eyebrow {
      color: #9c9ca8;

      font-size: 12px;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 30px;

      animation:
        fadeUp 1s .15s both;
    }

    h1 {
      font-size:
        clamp(60px, 12vw, 150px);

      line-height: .85;

      letter-spacing: -7px;

      margin-bottom: 35px;

      animation:
        titleReveal 1.3s .25s both;

      text-shadow:
        0 0 60px rgba(100,100,255,.08);
    }

    .serif {
      font-family:
        "Playfair Display",
        serif;

      font-style: italic;

      font-weight: 500;
    }

    h1 .serif {
      display: inline-block;

      background:
        linear-gradient(
          120deg,
          #ffffff,
          #9d8cff,
          #75dfff,
          #ffffff
        );

      background-size: 250% auto;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      animation:
        dotFloat 3s ease-in-out infinite,
        gradientText 6s linear infinite;
    }

    @keyframes gradientText {

      0% {
        background-position: 0% center;
      }

      100% {
        background-position: 250% center;
      }
    }

    .subtitle {
      color: #999;

      font-size:
        clamp(18px, 3vw, 25px);

      margin-bottom: 20px;

      animation:
        fadeUp 1s .45s both;
    }

    .subtitle .serif {
      color: #eee;
    }

    .description {
      max-width: 520px;

      margin: auto;

      color: #858590;

      line-height: 1.7;

      font-size: 14px;

      animation:
        fadeUp 1s .6s both;
    }


    /* =====================================================
       BUTTONS
    ===================================================== */

    .buttons {
      margin-top: 40px;

      display: flex;

      justify-content: center;

      gap: 15px;

      flex-wrap: wrap;

      animation:
        fadeUp 1s .75s both;
    }

    .btn {
      position: relative;

      padding:
        15px 27px;

      border-radius: 50px;

      border:
        1px solid rgba(255,255,255,.16);

      transition:
        transform .3s ease,
        border-color .3s ease,
        box-shadow .3s ease;

      font-size: 13px;

      overflow: hidden;

      background:
        rgba(255,255,255,.025);

      backdrop-filter: blur(10px);
    }

    .btn::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent,
          rgba(255,255,255,.4),
          transparent
        );

      transform:
        translateX(-120%);

      transition: .6s;
    }

    .btn:hover::before {
      transform:
        translateX(120%);
    }

    .btn.primary {
      background: white;

      color: black;

      border-color: white;

      box-shadow:
        0 0 30px
        rgba(130,120,255,.08);
    }

    .btn.primary:hover {
      box-shadow:
        0 10px 45px
        rgba(120,150,255,.25);
    }

    .btn:hover {
      border-color: rgba(150,190,255,.7);
    }


    /* =====================================================
       SCROLL INDICATOR
    ===================================================== */

    .scroll {
      position: absolute;

      bottom: 30px;
      left: 50%;

      transform:
        translateX(-50%);

      color: #666;

      font-size: 10px;

      letter-spacing: 3px;

      animation:
        scrollBounce 2s ease-in-out infinite;
    }

    @keyframes scrollBounce {

      0%,100% {
        transform:
          translate(-50%,0);

        opacity: .5;
      }

      50% {
        transform:
          translate(-50%,8px);

        opacity: 1;
      }
    }


    /* =====================================================
       SECTIONS
    ===================================================== */

    section:not(.hero) {
      padding:
        120px 7%;
    }

    .section-label {
      color: #72727c;

      font-size: 11px;

      letter-spacing: 3px;

      text-transform: uppercase;

      margin-bottom: 25px;
    }

    .section-title {
      font-size:
        clamp(40px, 7vw, 80px);

      letter-spacing: -4px;

      margin-bottom: 60px;
    }


    /* =====================================================
       PROJECTS
    ===================================================== */

    .projects {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 25px;
    }

    .project {
      min-height: 380px;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius: 20px;

      padding: 35px;

      display: flex;

      flex-direction: column;

      justify-content: flex-end;

      background:
        linear-gradient(
          145deg,
          rgba(30,30,45,.7),
          rgba(7,7,12,.8)
        );

      backdrop-filter:
        blur(12px);

      transition:
        transform .5s
        cubic-bezier(.16,1,.3,1),

        border-color .4s,

        box-shadow .4s;

      overflow: hidden;

      position: relative;
    }

    .project::before {
      content: "";

      position: absolute;

      width: 300px;
      height: 300px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(90,120,255,.22),
          transparent 70%
        );

      top: -130px;
      right: -130px;

      opacity: 0;

      transition: .6s;
    }

    .project::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          120deg,
          transparent 20%,
          rgba(255,255,255,.035),
          transparent 80%
        );

      transform:
        translateX(-100%);

      transition:
        transform .8s;
    }

    .project:hover::before {
      opacity: 1;

      transform:
        scale(1.4);
    }

    .project:hover::after {
      transform:
        translateX(100%);
    }

    .project:hover {
      border-color:
        rgba(130,160,255,.35);

      box-shadow:
        0 30px 90px
        rgba(0,0,0,.55),
        0 0 50px
        rgba(70,100,255,.06);
    }

    .project-number {
      color: #555;

      font-size: 12px;

      margin-bottom: auto;

      transition: .3s;
    }

    .project:hover .project-number {
      color: #9c9cff;

      transform:
        translateX(5px);
    }

    .project h3 {
      font-size: 32px;

      margin-bottom: 10px;

      transition: .4s;

      position: relative;

      z-index: 2;
    }

    .project:hover h3 {
      transform:
        translateX(6px);
    }

    .project p {
      color: #777;

      font-size: 13px;

      line-height: 1.6;

      transition: .4s;

      position: relative;

      z-index: 2;
    }

    .project:hover p {
      color: #aaa;
    }


    /* =====================================================
       ABOUT
    ===================================================== */

    .about {
      max-width: 850px;
    }

    .about p {
      font-size:
        clamp(25px, 4vw, 45px);

      line-height: 1.25;

      color: #888;

      letter-spacing: -1px;
    }

    .about strong {
      color: white;

      transition: .3s;
    }

    .about strong:hover {
      text-shadow:
        0 0 30px
        rgba(120,150,255,.4);
    }


    /* =====================================================
       SERVICES
    ===================================================== */

    .services {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }

    .service {
      padding: 35px;

      border:
        1px solid rgba(255,255,255,.07);

      border-radius: 18px;

      background:
        rgba(10,10,18,.65);

      backdrop-filter:
        blur(12px);

      transition:
        transform .5s
        cubic-bezier(.16,1,.3,1),

        border-color .4s,

        background .4s;

      position: relative;

      overflow: hidden;
    }

    .service::after {
      content: "";

      position: absolute;

      width: 120px;
      height: 120px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(80,150,255,.16),
          transparent 70%
        );

      top: -60px;
      right: -60px;

      transition: .6s;
    }

    .service:hover {
      transform:
        translateY(-10px);

      border-color:
        rgba(100,150,255,.3);

      background:
        rgba(20,20,32,.75);

      box-shadow:
        0 20px 60px
        rgba(0,0,0,.3);
    }

    .service:hover::after {
      transform:
        scale(2.5);
    }

    .service h3 {
      margin-bottom: 15px;

      position: relative;

      z-index: 1;
    }

    .service p {
      color: #777;

      font-size: 13px;

      line-height: 1.6;

      position: relative;

      z-index: 1;
    }


    /* =====================================================
       CONTACT
    ===================================================== */

    .contact {
      text-align: center;

      min-height: 70vh;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      background:
        radial-gradient(
          circle,
          rgba(30,35,70,.5),
          transparent 60%
        );

      position: relative;

      overflow: hidden;
    }

    .contact::before {
      content: "";

      position: absolute;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      border:
        1px solid
        rgba(120,140,255,.12);

      box-shadow:
        0 0 100px
        rgba(70,100,255,.08);

      animation:
        contactOrb 8s linear infinite;
    }

    .contact h2 {
      font-size:
        clamp(45px, 9vw, 100px);

      letter-spacing: -5px;

      margin-bottom: 25px;

      position: relative;

      z-index: 1;
    }

    .contact p {
      color: #777;

      margin-bottom: 35px;

      position: relative;

      z-index: 1;
    }

    .contact .btn {
      position: relative;

      z-index: 2;
    }

    @keyframes contactOrb {

      0% {
        transform:
          scale(.8)
          rotate(0deg);

        opacity: .3;
      }

      50% {
        transform:
          scale(1.15)
          rotate(180deg);

        opacity: .7;
      }

      100% {
        transform:
          scale(.8)
          rotate(360deg);

        opacity: .3;
      }
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      padding:
        30px 7%;

      border-top:
        1px solid rgba(255,255,255,.06);

      color: #555;

      font-size: 12px;

      display: flex;

      justify-content:
        space-between;
    }


    /* =====================================================
       SCROLL REVEAL
    ===================================================== */

    .reveal {
      opacity: 0;

      transform:
        translateY(50px);

      transition:
        opacity .9s ease,

        transform .9s
        cubic-bezier(.16,1,.3,1);
    }

    .reveal.visible {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* ===================================================
    
    const revealElements =
      document.querySelectorAll(
        ".reveal"
      );

    const revealObserver =
      new IntersectionObserver(

        (entries) => {

          entries.forEach(
            (entry) => {

              if (
                entry.isIntersecting
              ) {

                entry.target.classList.add(
                  "visible"
                );

                revealObserver.unobserve(
                  entry.target
                );

              }

            }
          );

        },

        {
          threshold: .12
        }

      );


    revealElements.forEach(
      (element) => {

        revealObserver.observe(
          element
        );

      }
    );


    /* =====================================================
       CURSOR GLOW
    ===================================================== */

    const cursorGlow =
      document.querySelector(
        ".cursor-glow"
      );


    document.addEventListener(
      "mousemove",
      (event) => {

        cursorGlow.style.left =
          event.clientX + "px";

        cursorGlow.style.top =
          event.clientY + "px";

      }
    );


    /* =====================================================
       MAGNETIC BUTTONS
    ===================================================== */

    const magneticButtons =
      document.querySelectorAll(
        ".magnetic"
      );


    magneticButtons.forEach(
      (button) => {

        button.addEventListener(
          "mousemove",
          (event) => {

            if (
              window.innerWidth < 700
            ) return;

            const rect =
              button.getBoundingClientRect();

            const x =
              event.clientX -
              rect.left -
              rect.width / 2;

            const y =
              event.clientY -
              rect.top -
              rect.height / 2;

            button.style.transform =
              `translate(
                ${x * .15}px,
                ${y * .15}px
              ) scale(1.04)`;

          }
        );


        button.addEventListener(
          "mouseleave",
          () => {

            button.style.transform =
              "";

          }
        );

      }
    );


    /* =====================================================
       PROJECT CARD 3D TILT
    ===================================================== */

    const projects =
      document.querySelectorAll(
        ".project"
      );


    projects.forEach(
      (project) => {

        project.addEventListener(
          "mousemove",
          (event) => {

            if (
              window.innerWidth < 700
            ) return;

            const rect =
              project.getBoundingClientRect();

            const x =
              event.clientX -
              rect.left;

            const y =
              event.clientY -
              rect.top;

            const rotateY =
              (
                (x / rect.width) -
                .5
              ) * 5;

            const rotateX =
              (
                (y / rect.height) -
                .5
              ) * -5;


            project.style.transform =
              `perspective(900px)
               rotateX(${rotateX}deg)
               rotateY(${rotateY}deg)
               translateY(-10px)
               scale(1.015)`;

          }
        );


        project.addEventListener(
          "mouseleave",
          () => {

            project.style.transform =
              "";

          }
        );

      }
    );


  </script>


</body>
</html>
